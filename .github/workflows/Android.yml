name: Build REDRIVER2 Android (ARMv8)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-android-armv8:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود مع Submodules
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. إعداد بيئة Java
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. إعداد Android SDK و NDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;25.2.9519653"

    # 4. تثبيت Premake5
    - name: Install Premake5
      run: |
        wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
        tar -xvf premake-5.0.0-beta2-linux.tar.gz
        sudo mv premake5 /usr/local/bin/

    # 5. إصلاح خطأ shortcommands والبناء لمعمارية ARMv8 (arm64-v8a)
    - name: Fix Premake Script and Build ARMv8
      run: |
        cd src_rebuild
        
        # حذف السطر الذي يحتوي على shortcommands "On" لتفادي خطأ nil value
        sed -i '/shortcommands/d' premake5.lua
        
        # 1. توليد ملفات البناء المخصصة للأندرويد
        premake5 androidndk
        
        # 2. الانتقال إلى مجلد البناء
        cd build
        
        # 3. البناء الحصري لمعمارية ARMv8 (arm64-v8a)
        $ANDROID_NDK_ROOT/ndk-build APP_ABI=arm64-v8a -j$(nproc)

    # 6. رفع مخرجات ARMv8 (.so)
    - name: Upload ARMv8 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: REDRIVER2-Android-arm64-v8a
        path: |
          src_rebuild/libs/arm64-v8a/
          src_rebuild/build/libs/arm64-v8a/
          src_rebuild/obj/local/arm64-v8a/
