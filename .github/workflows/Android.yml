name: Build REDRIVER2 Android (ARMv8)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-android-armv8:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود مع Submodules
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. إعداد Android SDK و NDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;25.2.9519653"

    # 3. تثبيت Premake5
    - name: Install Premake5
      run: |
        wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
        tar -xvf premake-5.0.0-beta2-linux.tar.gz
        sudo mv premake5 /usr/local/bin/

    # 4. التوليد والبناء الحصري لمعمارية ARMv8 / ARM64
    - name: Build ARMv8 Binary
      run: |
        cd src_rebuild
        
        # توليد ملفات Make
        premake5 gmake2 --os=android
        
        cd build
        
        # تحديد مسارات أدوات البناء الخاصة بـ ARM64 (ARMv8)
        NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
        export CC=$NDK_BIN/aarch64-linux-android21-clang
        export CXX=$NDK_BIN/aarch64-linux-android21-clang++
        export AR=$NDK_BIN/llvm-ar
        
        # بدء عملية البناء
        make config=release_android-arm64 -j$(nproc) || make config=release -j$(nproc)

    # 5. رفع مخرجات ARMv8
    - name: Upload ARMv8 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: REDRIVER2-Android-ARMv8
        path: |
          src_rebuild/bin/
