name: Build REDRIVER2 Android

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود مع كافة الـ Submodules
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. إعداد بيئة Java
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. إعداد Android SDK و NDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;25.2.9519653"

    # 4. تحميل وتثبيت Premake5
    - name: Install Premake5
      run: |
        wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
        tar -xvf premake-5.0.0-beta2-linux.tar.gz
        sudo mv premake5 /usr/local/bin/
        premake5 --version

    # 5. توليد ملفات البناء لنظام الأندرويد
    - name: Generate Android Build Files
      run: premake5 gmake2 --os=android

    # 6. بناء المشروع باستخدام NDK Clang
    - name: Build Android Libraries
      run: |
        cd build
        make config=release_android-arm64 -j$(nproc) || make config=release -j$(nproc)

    # 7. رفع المخرجات
    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: REDRIVER2-Android-Build
        path: |
          bin/
          libs/
          obj/
