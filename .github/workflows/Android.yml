name: Build REDRIVER2 Android

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود مع Submodules
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. إعداد بيئة Java
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. إعداد Android SDK و NDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;25.2.9519653"

    # 4. تثبيت Premake5
    - name: Install Premake5
      run: |
        wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
        tar -xvf premake-5.0.0-beta2-linux.tar.gz
        sudo mv premake5 /usr/local/bin/

    # 5. التوليد والبناء من داخل مجلد src_rebuild
    - name: Build Android via NDK
      run: |
        cd src_rebuild
        
        # إنشاء ملفات البناء بواسطة Premake5 (عبر خيار gmake2 المخصص)
        premake5 gmake2 --os=android
        
        # التحقق من مكان مجلد البناء الناتج والدخول إليه
        if [ -d "build" ]; then
          cd build
        elif [ -d "../build" ]; then
          cd ../build
        fi
        
        # تنفيذ عملية التجميع باستخدام Android NDK Toolchain
        $ANDROID_NDK_ROOT/ndk-build -j$(nproc) NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk || make -j$(nproc)

    # 6. رفع المخرجات والملفات الناتجة
    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: REDRIVER2-Android-Build
        path: |
          src_rebuild/bin/
          src_rebuild/libs/
          src_rebuild/obj/
          bin/
