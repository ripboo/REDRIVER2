name: Build REDRIVER2 Android (ARMv8 / arm64-v8a)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-android-armv8:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب السورس كود مع جميع الـ Submodules
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. إعداد بيئة Java
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. تثبيت Android SDK و NDK
    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        sdkmanager --install "ndk;25.2.9519653"

    # 4. تحميل وتثبيت Premake5
    - name: Install Premake5
      run: |
        wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
        tar -xvf premake-5.0.0-beta2-linux.tar.gz
        sudo mv premake5 /usr/local/bin/
        premake5 --version

    # 5. التوليد والبناء الحصري لمعمارية ARMv8 باستخدام ndk-build
    - name: Generate and Build ARMv8 Shared Libraries
      run: |
        cd src_rebuild
        
        # 1. تشغيل Premake5 لتوليد ملفات Android.mk و Application.mk عبر الموديول
        premake5 androidndk
        
        # 2. الانتقال إلى مجلد البناء الناتج
        cd build
        
        # 3. تشغيل ndk-build وتمرير APP_ABI المخصص لـ ARMv8 فقط
        $ANDROID_NDK_ROOT/ndk-build APP_ABI=arm64-v8a -j$(nproc)

    # 6. رفع ملفات المكتبات (.so) الخاصة بـ ARMv8
    - name: Upload ARMv8 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: REDRIVER2-Android-arm64-v8a
        path: |
          src_rebuild/libs/arm64-v8a/
          src_rebuild/build/libs/arm64-v8a/
          src_rebuild/obj/local/arm64-v8a/
