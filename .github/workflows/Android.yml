name: Build REDRIVER2 Android

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود مع كافة الـ Submodules
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. إعداد بيئة Java المعتمدة لبناء الأندرويد
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. إعداد Android SDK و NDK
    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;25.2.9519653"

    # 4. تثبيت Premake5
    - name: Setup Premake
      uses: abel2333/setup-premake@v1
      with:
        version: '5.0.0-beta2'

    # 5. توليد ملفات البناء الخاصة بالـ Android NDK
    - name: Generate Android Build Files
      run: premake5 androidndk

    # 6. بناء المشروع باستخدام NDK-Build
    - name: Build Android Libraries
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        $ANDROID_NDK_ROOT/ndk-build -C build

    # 7. رفع المخرجات الجاهزة (ملفات .so / .apk)
    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: REDRIVER2-Android-Build
        path: |
          bin/
          libs/
          obj/
