name: Build REDRIVER2 Android (ARMv8)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-android-armv8:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب المستودع مع الفرع الفرعية Submodules
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. إعداد Android SDK و NDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 3. تثبيت Premake5
    - name: Install Premake5
      run: |
        wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
        tar -xvf premake-5.0.0-beta2-linux.tar.gz
        sudo mv premake5 /usr/local/bin/

    # 4. إصلاح premake5.lua وبناء المشروع حصرياً لـ ARMv8
    - name: Patch Premake Script & Build ARMv8
      run: |
        cd src_rebuild
        
        # 1. استنساخ SDL2 Headers
        git clone https://github.com/libsdl-org/SDL.git -b SDL2 --depth 1 temp_sdl
        
        # 2. تفعيل وضع الأندرويد وحذف الأوامر المتقادمة وخيارات ARM32 غير المتوافقة مع ARM64
        sed -i 's/IS_ANDROID = (_ACTION == "androidndk")/IS_ANDROID = true/g' premake5.lua
        sed -i '/shortcommands/d' premake5.lua
        sed -i '/-mfloat-abi=softfp/d' premake5.lua
        sed -i '/-mfpu=neon/d' premake5.lua
        
        # 3. تعطيل بناء FontTool عند تفعيل وضع الأندرويد لتجنب أخطاء تجميع الأدوات
        sed -i 's/if os.target() ~= "emscripten" then/if os.target() ~= "emscripten" and not IS_ANDROID then/g' premake5.lua
        
        # 4. إضافة التعريفات اللازمة لمعالجة أحجام Types على منصة 64-bit
        sed -i '/defines { VERSION }/a \    defines { "PSX_LONG_IS_INT", "__ANDROID__" }' premake5.lua

        # 5. توليد ملفات البناء
        premake5 gmake2 --os=android
        
        cd build
        
        # 6. تعيين مسارات أدوات Android NDK الخاصة بـ ARMv8 / ARM64 (aarch64)
        NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
        export CC=$NDK_BIN/aarch64-linux-android21-clang
        export CXX=$NDK_BIN/aarch64-linux-android21-clang++
        export AR=$NDK_BIN/llvm-ar
        
        # 7. توجيه المترجم لملفات SDL2 Headers
        export C_INCLUDE_PATH="$PWD/../temp_sdl/include:$C_INCLUDE_PATH"
        export CPLUS_INCLUDE_PATH="$PWD/../temp_sdl/include:$CPLUS_INCLUDE_PATH"
        
        # 8. تنفيذ البناء لـ PsyCross و REDRIVER2 بالترتيب
        make PsyCross config=release_android-arm64 -j$(nproc)
        make REDRIVER2 config=release_android-arm64 -j$(nproc)

    # 5. رفع نتائج البناء كـ Artifacts
    - name: Upload ARMv8 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: REDRIVER2-Android-arm64-v8a
        path: |
          src_rebuild/bin/
          src_rebuild/build/
